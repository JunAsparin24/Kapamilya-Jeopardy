<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <rect width="900" height="200" fill="#ce1126"/>
  <rect y="200" width="900" height="200" fill="#ffffff"/>
  <rect y="400" width="900" height="200" fill="#000000"/>
  <!-- the golden Eagle of Saladin (simplified), looking to its right -->
  <g fill="#c09300" stroke="#8a6a00" stroke-width="2" stroke-linejoin="round">
    <!-- wings -->
    <path d="M430,256 Q396,244 380,262 L376,338 Q390,356 414,346 L428,300 Z"/>
    <path d="M470,256 Q504,244 520,262 L524,338 Q510,356 486,346 L472,300 Z"/>
    <!-- tail -->
    <path d="M432,338 L468,338 L478,372 L422,372 Z"/>
    <!-- body -->
    <path d="M424,252 H476 V318 Q476,344 450,352 Q424,344 424,318 Z"/>
    <!-- neck and head with a hooked beak -->
    <path d="M440,254 Q438,236 432,230 Q418,232 412,240 Q420,236 428,240 Q424,222 438,214 Q456,210 462,226 Q464,240 460,254 Z"/>
    <!-- the plaque it stands on -->
    <rect x="402" y="372" width="96" height="16" rx="6"/>
  </g>
  <!-- shield on the chest: red, white and black stripes -->
  <path d="M436,268 H464 V308 Q464,322 450,328 Q436,322 436,308 Z" fill="#ffffff" stroke="#8a6a00" stroke-width="2"/>
  <path d="M436,268 H445.3 V326 Q436,320 436,308 Z" fill="#ce1126"/>
  <path d="M454.7,268 H464 V308 Q464,320 454.7,326 Z" fill="#000000"/>
  <circle cx="437" cy="225" r="2.2" fill="#000000"/>
</svg>
