<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 9 6">
  <defs>
    <!-- the triangle at the flagpole side, where the gold border and black sit -->
    <clipPath id="hoist">
      <polygon points="0,0 4.5,3 0,6"/>
    </clipPath>
  </defs>
  <!-- red top, blue bottom -->
  <rect width="9" height="3" fill="#e03c31"/>
  <rect y="3" width="9" height="3" fill="#001489"/>
  <!-- white edging around the green Y -->
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <polyline points="0,0 4.5,3 0,6"/>
    <line x1="4.5" y1="3" x2="9" y2="3"/>
  </g>
  <!-- the green Y -->
  <g fill="none" stroke="#007749" stroke-width="1.2">
    <polyline points="0,0 4.5,3 0,6"/>
    <line x1="4.5" y1="3" x2="9" y2="3"/>
  </g>
  <!-- gold border and black triangle, inside the Y -->
  <g clip-path="url(#hoist)">
    <polygon points="0,0 4.5,3 0,6" fill="#ffb81c"/>
    <polygon points="0,1.202 2.697,3 0,4.798" fill="#000000"/>
    <polyline points="0,0 4.5,3 0,6" fill="none" stroke="#007749" stroke-width="1.2"/>
  </g>
</svg>
